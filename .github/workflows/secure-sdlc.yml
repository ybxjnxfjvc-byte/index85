name: secure-sdlc
on: [push, pull_request]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python security/scripts/repo_gate.py .
      - run: python -m unittest discover -s security/tests/python -p 'test_*.py'
      - run: python security/scripts/dependency_inventory.py . > dependency-inventory.json
